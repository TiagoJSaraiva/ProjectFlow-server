# Perfil de testes: H2 em memoria em modo MySQL, sem dependencia de banco externo.
spring.datasource.url=jdbc:h2:mem:projectflow_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Segredo ficticio, apenas para testes (64+ caracteres)
app.jwt.secret=segredo-jwt-apenas-para-testes-automatizados-nao-usar-em-nenhum-outro-lugar-0123456789
app.cors.allowed-origins=http://localhost:4200
spring.sql.init.mode=never
