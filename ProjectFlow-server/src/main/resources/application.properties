# ================================
# DATABASE CONFIGURATION
# ================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/project_flow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / HIBERNATE CONFIGURATION
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# ================================
# MAIL CONFIGURATION (opcional; ex.: MAIL_HOST=smtp.gmail.com)
# ================================
# Sem MAIL_HOST o SMTP fica desativado: os codigos/links de verificacao e recuperacao vao para o log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@projectflow.local}}

# ================================
# JWT CONFIGURATION
# ================================
# Obrigatorio: definido apenas por variavel de ambiente (minimo 64 caracteres), sem valor padrao.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000

# ================================
# CORS CONFIGURATION
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,Cache-Control
app.cors.allow-credentials=true
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# ================================
# SERVER CONFIGURATION
# ================================
server.port=8080
server.servlet.context-path=/

# ================================
# LOGGING CONFIGURATION
# ================================
logging.level.com.polo42.project_flow=INFO
logging.level.org.springframework.security=INFO

# ================================
# ADDITIONAL CONFIGURATION
# ================================
spring.web.resources.add-mappings=false